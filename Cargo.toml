[workspace]
resolver = "2"
members = ["crates/types", "crates/conformance", "crates/state", "crates/exec", "crates/network", "crates/node", "crates/zk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[workspace.dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
thiserror = "1"
