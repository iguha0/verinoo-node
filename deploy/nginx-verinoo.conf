# Reference nginx site for verinoo-node.
#
# This is NOT a hardened production edge. It has no authentication, TLS, WAF or
# hard per-client request/connection limits. Before exposing /snapshot/
# publicly, define zones in the http {} context (for example in
# /etc/nginx/nginx.conf):
#
#   limit_req_zone $binary_remote_addr zone=verinoo_snapshot_req:10m rate=2r/s;
#   limit_conn_zone $binary_remote_addr zone=verinoo_snapshot_conn:10m;
#
# then uncomment the limit_req/limit_conn lines in location /snapshot/ below.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    location /api/ {
        proxy_pass http://127.0.0.1:7100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Public snapshot reads: signed manifest and state/ checkpoint files.
    # Range requests pass through for resumable downloads. The node rejects
    # traversal and symlinks, but checkpoints can be large: rate-limit,
    # concurrency-limit and egress-cap this location before public exposure.
    location /snapshot/ {
        proxy_pass http://127.0.0.1:7100/snapshot/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Define the zones in http {} first, then uncomment:
        # limit_req zone=verinoo_snapshot_req burst=4 nodelay;
        # limit_conn verinoo_snapshot_conn 2;

        # Per-connection egress cap after the first 16 MiB. This is not a
        # substitute for the request/connection limits above.
        limit_rate_after 16m;
        limit_rate 10m;

        # Stream large checkpoint files instead of buffering them to disk.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    # Readiness probe: 200 when caught up and serving, 503 otherwise.
    location = /ready {
        proxy_pass http://127.0.0.1:7100/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else -> static landing site
    root /var/www/verinoo;
    index index.html;
}
