server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    location /api/ {
        proxy_pass http://127.0.0.1:7100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else -> static landing site
    root /var/www/verinoo;
    index index.html;
}
