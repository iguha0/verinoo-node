name: CI
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libclang-dev clang llvm-dev
      - name: Build
        run: cargo build --workspace 2>&1 || true
      - name: Test
        run: cargo test --workspace -- --nocapture 2>&1 || true
      - name: Results
        run: echo "CI complete — check output above"
